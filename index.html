  <body style="height: 100%; margin: 0; overflow: hidden; font-family: Roboto; color: #fff; background-color: #000;">
    <script src="./coi-serviceworker.min.js"></script>
    <script>
      // mantém o service worker vivo enquanto arquivos grandes chegam (aviso da página original)
      if (navigator.serviceWorker && navigator.serviceWorker.controller !== null) {
        setInterval(() => { navigator.serviceWorker.controller.postMessage({ type: "heartbeat" }); }, 5000);
      }
    </script>
    <div id="spinner-target" style="position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;">
      <div id="progressbar-target" style="display: none; width: 70px; height: 70px"></div>

    <canvas id="nostalgist-canvas" style="position: fixed; left: 0; top: 0; width: 100%; height: 100%"></canvas>
  </body>
